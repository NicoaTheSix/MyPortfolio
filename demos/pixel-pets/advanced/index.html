<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="嗶嗶電子雞示範商店。挑選機器人、小生物、外星人或實體角色。">
  <title>嗶嗶電子雞｜透明機身實驗室</title>
  <link rel="stylesheet" href="../../../assets/fonts/fonts.css">
  <link rel="stylesheet" href="../styles.css">
  <script src="../pets.js" defer></script>
  <link rel="icon" href="logo-transparent.png">
  <link rel="stylesheet" href="../../advanced/advanced.css">
  <script src="../site.js" defer></script>
  <script src="../../advanced/advanced.js" defer></script>
</head>
<body id="top" class="pet-edition">
  <a class="skip-link" href="#catalog">跳到商品</a>
  <div class="runner-layer" aria-hidden="true"></div>

  <header class="desktop-bar">
    <div class="shell desktop-inner">
      <a class="brand" href="#top"><img src="logo.png" alt="" width="44" height="44"> 嗶嗶電子雞</a>
      <div class="desktop-actions">
        <a href="../">原版</a><a href="../../../#website-demos">作品集</a>
        <button class="bevel desktop-cart" id="open-cart" type="button">購物車 <span id="cart-count">0</span></button>
      </div>
    </div>
  </header>

  <main class="shell">
    <section class="pet-experiment" aria-labelledby="hero-title" data-device>
      <div class="pet-console">
        <div class="pet-console-copy">
          <p class="kicker">BEEP PETS / 透明機身實驗室</p>
          <h1 id="hero-title">電子雞<br>開機中。</h1>
          <p>展開外殼，看看 LCD、按鍵和電路板。選一隻寵物，試試牠的五種動作。</p>
          <a class="edition-button" href="#catalog">逛寵物商店 ↓</a>
        </div>
        <div class="device-demo">
          <div class="device-stage" aria-hidden="true">
            <div class="device-layer circuit" data-layer="circuit"><span>BP 01</span><i></i><i></i></div>
            <div class="device-layer switches" data-layer="buttons"><i></i><i></i><i></i></div>
            <div class="device-layer screen" data-layer="screen"><canvas width="20" height="20" data-device-screen></canvas></div>
            <div class="device-layer case" data-layer="case"><i></i><i></i></div>
          </div>
          <div class="device-controls" role="group" aria-label="機身零件" hidden>
            <button type="button" data-part="all" aria-pressed="true">組合／展開</button>
            <button type="button" data-part="case" aria-pressed="false">外殼</button>
            <button type="button" data-part="screen" aria-pressed="false">螢幕</button>
            <button type="button" data-part="buttons" aria-pressed="false">按鍵</button>
            <button type="button" data-part="circuit" aria-pressed="false">電路板</button>
          </div>
          <p class="device-note" data-part-note aria-live="polite">往下捲動或點擊零件，觀察機身如何展開。</p>
        </div>
      </div>
      <div class="pet-test" hidden>
        <div><h2>在機身上試玩</h2><label for="device-pet">選擇寵物</label> <select id="device-pet"></select></div>
        <div class="device-moves" role="group" aria-label="試玩動作"></div>
      </div>
    </section>
    <div class="hero-sprites" hidden aria-hidden="true"></div>

    <section class="catalog" id="catalog" aria-labelledby="catalog-title">
      <div class="catalog-heading">
        <h2 id="catalog-title">寵物圖鑑</h2>
        <p id="result-count">16 隻角色</p>
      </div>
      <div class="filters" role="group" aria-label="商品分類"></div>
      <div class="motion-chooser">
        <span id="motion-label">寵物動作</span>
        <div class="motion-buttons" role="group" aria-labelledby="motion-label"></div>
      </div>
      <div class="pet-grid" id="pet-grid"></div>
      <noscript><p>啟用 JavaScript 後即可查看角色與操作購物車。</p></noscript>
    </section>
  </main>

  <footer class="taskbar">
    <div class="shell taskbar-inner">
      <button class="bevel" id="toggle-runners" type="button" aria-pressed="false">暫停背景</button>
      <p id="shop-status" role="status">示範商店就緒</p>
      <div class="pet-downloads"><a href="logo.png" download="pixel-pets-logo.png">下載 Logo</a><a href="logo-transparent.png" download="pixel-pets-logo-transparent.png">下載透明 PNG</a><a href="#top">回到桌面 ↑</a></div>
    </div>
  </footer>

  <template id="pet-window">
    <article class="pet-window">
      <div class="titlebar"><span class="window-icon" aria-hidden="true"></span><h3></h3><span class="window-mark" aria-hidden="true">▣</span></div>
      <div class="pet-screen"><span class="pet-action" aria-hidden="true"></span></div>
      <div class="window-meta">
        <span class="category-tag"></span>
        <strong class="price"></strong>
      </div>
      <button class="bevel add-pet" type="button">＋ 加入購物車</button>
    </article>
  </template>

  <dialog id="cart" aria-labelledby="cart-title">
    <div class="titlebar">
      <h2 id="cart-title">購物車</h2>
      <form method="dialog"><button class="bevel close-cart" aria-label="關閉購物車">×</button></form>
    </div>
    <div class="cart-body">
      <p id="empty-cart">購物車目前是空的。</p>
      <ul id="cart-items"></ul>
      <div class="cart-summary"><strong>合計</strong><strong id="cart-total">NT$0</strong></div>
      <button class="bevel checkout" id="checkout" type="button" disabled>模擬結帳</button>
      <p id="cart-status" role="status"></p>
    </div>
  </dialog>
</body>
</html>
