<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#120b11">
  <title>Web Visual Design Showcase | Nicoa'Lab</title>
  <link rel="icon" href="../../../assets/brand/nicoa-lab-symbol-transparent-32.png">
  <link rel="stylesheet" href="../style.css?v=layered-light-r1">
  <script type="module" src="../site.js?v=layered-light-r1"></script>
  <!-- portfolio-seo:start -->
  <meta name="description" content="View the Nicoa’Lab magenta poster full screen and switch between a still image and moving fog.">
  <link rel="canonical" href="https://nicoathesix.github.io/MyPortfolio/demos/visual-design/en/">
  <link rel="alternate" hreflang="zh-Hant" href="https://nicoathesix.github.io/MyPortfolio/demos/visual-design/">
  <link rel="alternate" hreflang="en" href="https://nicoathesix.github.io/MyPortfolio/demos/visual-design/en/">
  <link rel="alternate" hreflang="x-default" href="https://nicoathesix.github.io/MyPortfolio/demos/visual-design/">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Nicoa’Lab">
  <meta property="og:title" content="Web Visual Design Showcase | Nicoa'Lab">
  <meta property="og:description" content="View the Nicoa’Lab magenta poster full screen and switch between a still image and moving fog.">
  <meta property="og:url" content="https://nicoathesix.github.io/MyPortfolio/demos/visual-design/en/">
  <meta property="og:image" content="https://nicoathesix.github.io/MyPortfolio/demos/visual-design/assets/poster-magenta.webp">
  <!-- portfolio-seo:end -->
</head>
<body>
  <main class="exhibit" data-mode="still">
    <header class="exhibit-header">
      <a href="../../../en/#website-demos">← Website demos</a>
      <h1>Web Visual Design Showcase</h1>
      <a data-exhibit-language href="../" lang="zh-Hant" hreflang="zh-Hant">繁體中文</a>
    </header>
    <div class="stage">
      <figure class="poster">
        <img src="../assets/poster-magenta.webp"
          srcset="../assets/poster-magenta-640.webp 640w, ../assets/poster-magenta.webp 1024w"
          sizes="(max-width: 720px) 100vw, min(100vw, 67svh)"
          width="1024" height="1536" fetchpriority="high" alt="The Nicoa’Lab magenta poster, looking down on a character facing away on rocky ground with a long diagonal shadow.">
        <div class="poster-layers" aria-hidden="true">
          <img class="poster-floor" data-src="../assets/floor.webp" alt="">
          <div class="poster-character">
            <img data-src="../assets/character.webp?v=unlit" alt="">
          </div>
          <canvas class="character-normal-light" width="256" height="384"></canvas>
          <canvas class="character-layered-light"></canvas>
          <img class="poster-wordmark" data-src="../assets/wordmark.webp" alt="">
        </div>
        <canvas class="mist" width="128" height="112" aria-hidden="true"></canvas>
        <canvas class="mist mist-foreground" width="128" height="40" aria-hidden="true"></canvas>
        <div class="ground-sweep" aria-hidden="true"></div>
        <div class="layered-light-surface" tabindex="0" role="group" aria-label="Move the light" aria-describedby="layered-light-guide"></div>
      </figure>
    </div>
    <footer class="exhibit-controls" hidden>
      <div class="mode-controls" role="group" aria-label="Display mode">
        <button type="button" data-show-mode="still" aria-pressed="true">Still</button>
        <button type="button" data-show-mode="mist" aria-pressed="false">Moving fog</button>
        <button type="button" data-show-mode="layers" aria-pressed="false">Layered fog</button>
      </div>
      <button type="button" data-fullscreen data-enter-label="Full screen" data-exit-label="Exit full screen">Full screen</button>
      <label class="light-controls" hidden>Lighting
        <select data-light-preset>
          <option value="mask">Painted mask</option>
          <option value="sweep">Ground sweep</option>
          <option value="normal">Normal-map light</option>
          <option value="layered">Layered lighting</option>
          <option value="off">Lights off</option>
        </select>
      </label>
      <p id="layered-light-guide" class="layered-light-guide" hidden>Move the mouse or drag over the character to move the light. Arrow keys also work.</p>
      <p class="exhibit-status" role="status" data-layer-error="The layers could not load. The still poster is shown." hidden></p>
    </footer>
  </main>
</body>
</html>
