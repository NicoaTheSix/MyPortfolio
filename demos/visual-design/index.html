<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#120b11">
  <title>網頁視覺設計展示 | Nicoa'Lab</title>
  <link rel="icon" href="./../../assets/brand/nicoa-lab-symbol-transparent-32.png">
  <link rel="stylesheet" href="./style.css?v=layered-light-r3">
  <script type="module" src="./site.js?v=layered-light-r3"></script>
  <!-- portfolio-seo:start -->
  <meta name="description" content="全螢幕呈現 Nicoa’Lab 紫紅海報，可切換靜態與流動霧氣。">
  <link rel="canonical" href="https://nicoathesix.github.io/MyPortfolio/demos/visual-design/">
  <link rel="alternate" hreflang="zh-Hant" href="https://nicoathesix.github.io/MyPortfolio/demos/visual-design/">
  <link rel="alternate" hreflang="en" href="https://nicoathesix.github.io/MyPortfolio/demos/visual-design/en/">
  <link rel="alternate" hreflang="x-default" href="https://nicoathesix.github.io/MyPortfolio/demos/visual-design/">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Nicoa’Lab">
  <meta property="og:title" content="網頁視覺設計展示 | Nicoa'Lab">
  <meta property="og:description" content="全螢幕呈現 Nicoa’Lab 紫紅海報，可切換靜態與流動霧氣。">
  <meta property="og:url" content="https://nicoathesix.github.io/MyPortfolio/demos/visual-design/">
  <meta property="og:image" content="https://nicoathesix.github.io/MyPortfolio/demos/visual-design/assets/poster-magenta.webp">
  <!-- portfolio-seo:end -->
</head>
<body>
  <main class="exhibit" data-mode="still">
    <header class="exhibit-header">
      <a href="../../#website-demos">← 示範網站</a>
      <h1>網頁視覺設計展示</h1>
      <a data-exhibit-language href="./en/" lang="en" hreflang="en">English</a>
    </header>
    <div class="stage">
      <figure class="poster">
        <img src="./assets/poster-magenta.webp"
          srcset="./assets/poster-magenta-640.webp 640w, ./assets/poster-magenta.webp 1024w"
          sizes="(max-width: 720px) 100vw, min(100vw, 67svh)"
          width="1024" height="1536" fetchpriority="high" alt="Nicoa’Lab 紫紅海報，從角色後上方俯視岩地，長影落向右下。">
        <div class="poster-layers" aria-hidden="true">
          <img class="poster-floor" data-src="./assets/floor.webp" alt="">
          <div class="poster-character">
            <img data-src="./assets/character.webp?v=unlit" alt="">
            <img class="poster-character-original" data-src="./assets/character-original-lit.webp" alt="">
          </div>
          <canvas class="character-normal-light" width="256" height="384"></canvas>
          <canvas class="character-layered-light"></canvas>
          <img class="poster-wordmark" data-src="./assets/wordmark.webp" alt="">
        </div>
        <canvas class="mist" width="128" height="112" aria-hidden="true"></canvas>
        <canvas class="mist mist-foreground" width="128" height="40" aria-hidden="true"></canvas>
        <div class="ground-sweep" aria-hidden="true"></div>
        <div class="layered-light-surface" tabindex="0" role="group" aria-label="移動光源" aria-describedby="layered-light-guide"></div>
      </figure>
    </div>
    <footer class="exhibit-controls" hidden>
      <div class="mode-controls" role="group" aria-label="展示模式">
        <button type="button" data-show-mode="still" aria-pressed="true">靜態</button>
        <button type="button" data-show-mode="mist" aria-pressed="false">動態霧氣</button>
        <button type="button" data-show-mode="layers" aria-pressed="false">分層霧氣</button>
      </div>
      <button type="button" data-fullscreen data-enter-label="全螢幕" data-exit-label="離開全螢幕">全螢幕</button>
      <label class="light-controls" hidden>打光
        <select data-light-preset>
          <option value="original" disabled hidden>原版海報</option>
          <option value="mask">分區遮罩</option>
          <option value="sweep">貼地掃光</option>
          <option value="normal">法線打光</option>
          <option value="layered">分層打光</option>
          <option value="original-lit">原海報打光</option>
          <option value="layered-lit">2.5D 原海報打光</option>
          <option value="off">關燈</option>
        </select>
      </label>
      <p id="layered-light-guide" class="layered-light-guide" hidden>移動滑鼠或拖曳角色區域來移燈，也可用方向鍵。</p>
      <p class="exhibit-status" role="status" data-mist-light-error="角色圖層載入失敗，已回到原版動態霧氣。" data-layer-error="分層素材載入失敗，已回到靜態海報。" hidden></p>
    </footer>
  </main>
</body>
</html>
